[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucous"
version = "0.1.0"
description = "Glaucous —— 雨过天青，海鸥滑翔，代码自有清凉。一个清爽可控的 CLI 编程智能体。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Glaucous" }]
dependencies = [
    # 只把 openai SDK 当 HTTP 通道使用（需求文档约束 3）；
    # 重试/退避/流式 tool-call 拼装/解析容错均自研（概设 §3）
    "openai>=1.40,<2",
    # 终端 UI（概设 §3 技术选型：rich 渲染 + prompt_toolkit 输入，M3 落地）
    "rich>=13,<14",
    "prompt_toolkit>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
glaucous = "glaucous.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 内置示例 skill（M3 任务 3.5，随包分发；Day5 Plan §4.5）
"glaucous" = ["assets/skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
